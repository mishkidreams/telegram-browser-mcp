<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Telegram — локальное окно управления</title><link rel="stylesheet" href="/viewer.css"><script src="/viewer.js" defer></script></head>
<body><header><h1>Локальное окно управления</h1><p>Живая страница того же headless-браузера. Ввод и изображение не отправляются агенту.</p><p id="origin"></p><div class="toolbar"><strong id="state">CONNECTING</strong><button id="resume" disabled>Готово — проверить и продолжить</button><button id="cancel" disabled>Отменить</button><span id="notice" role="status"></span></div></header>
<main><p id="hint">Нажми на изображение для ввода. Вставка из буфера — Ctrl+V. Это прототип, не готовый Telegram MCP.</p><img id="screen" tabindex="0" alt="Живая страница появится после подключения" draggable="false" hidden></main></body></html>
